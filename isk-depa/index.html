<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ISK eller depå – simulator</title>
  <link rel="stylesheet" href="stil.css">
  <!-- Preview page. The rules below stand in for the WordPress theme, as in
       itp/index.html. -->
  <style>
    @font-face {
      font-family: Lato; font-weight: 400; font-display: swap;
      src: url("typsnitt/lato-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Lato; font-weight: 700; font-display: swap;
      src: url("typsnitt/lato-latin-700-normal.woff2") format("woff2");
    }
    body {
      margin: 0;
      font-family: Lato, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111c22;
      background: #fafafa;
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    h1, h2, h3 { color: #325567; line-height: 1.25; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    h2 { font-size: 1.2rem; margin: 32px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #dde8ee; vertical-align: top; }
  </style>
</head>
<body>
  <main>
    <h1>ISK eller depå?</h1>
    <p>
      Jämför vad som blir kvar efter skatt med aktierna på ISK eller på en
      depå (aktie- och fondkonto), med samma pengar och med samma risk.
      Ett arbetsverktyg, inte publicerat.
    </p>

    <div class="sg-iskdepa"></div>
  </main>

  <!-- Preview only: every load asks for fresh files, so the browser never
       mixes a new file with an old cached one after a merge. On the site the
       plugin adds ?ver= instead. visning.js passes the query on to the other
       modules. -->
  <script type="module">
    const v = `?v=${Date.now()}`;
    document.querySelector('link[href="stil.css"]').href = `stil.css${v}`;
    import(`./visning.js${v}`);
  </script>
</body>
</html>
