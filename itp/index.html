<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ITP-räknesnurra – förhandsvisning</title>
  <link rel="stylesheet" href="stil.css">
  <!-- Preview page only. On the site, WordPress gives the page title and the
       theme styles the text; the rules below stand in for the theme so the tool
       can be tried locally. Inputs and buttons get no rules here, since the
       theme gives them none. -->
  <style>
    @font-face {
      font-family: Lato; font-weight: 400; font-display: swap;
      src: url("typsnitt/lato-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Lato; font-weight: 700; font-display: swap;
      src: url("typsnitt/lato-latin-700-normal.woff2") format("woff2");
    }
    body {
      margin: 0;
      font-family: Lato, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111c22;
      background: #fafafa;
      line-height: 1.5;
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1, h2, h3 { color: #325567; line-height: 1.25; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    h2 { font-size: 1.2rem; margin: 32px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #dde8ee; vertical-align: top; }
  </style>
</head>
<body>
  <main>
    <h1>Vad kostar din ITP1-pension dig?</h1>
    <p>
      Räkna ut hur mycket mer pension du kan få genom att flytta det som går att
      flytta till fondförsäkring, och vad regeln om att hälften måste ligga i
      traditionell försäkring kostar dig.
    </p>

    <!-- The same element the WordPress shortcode outputs. -->
    <div class="sg-itp"></div>
  </main>

  <script type="module" src="visning.js"></script>
</body>
</html>
